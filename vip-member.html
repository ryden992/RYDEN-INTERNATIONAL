<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#030407">
  <title>VIP Member | RYDEN INTERNATIONAL</title>
  <style>
    :root { color-scheme: dark; --blue:#344cff; --text:#f4f6ff; --muted:#aab4d4; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:#030407; color:var(--text); font-family:Arial,Helvetica,sans-serif; }
    .top { display:flex; align-items:center; gap:12px; padding:18px 16px; background:#070a15; border-bottom:1px solid #2637d8; }
    .back { display:grid; place-items:center; width:38px; height:38px; flex:0 0 38px; border:1px solid #344cff; border-radius:12px; color:white; text-decoration:none; font-size:22px; }
    .brand { min-width:0; text-align:center; flex:1; }
    .brand strong { display:block; font-size:19px; font-weight:900; letter-spacing:1.2px; }
    .brand span { display:block; margin-top:3px; color:#a8bcff; font-size:10px; letter-spacing:2.2px; }
    main { width:min(100% - 32px,760px); margin:24px auto; }
    .panel { min-height:280px; padding:24px 18px; border:1px solid #344cff; border-radius:20px; background:radial-gradient(ellipse at 90% 0%,#173d8050,transparent 45%),linear-gradient(145deg,#090d1b,#05060b); box-shadow:inset 0 0 0 1px #ffffff05; }
    .eyebrow { color:#9dd9ff; font-size:11px; font-weight:800; letter-spacing:2px; }
    h1 { margin:12px 0 8px; font-size:clamp(27px,7vw,38px); font-weight:900; }
    .intro { margin:0; color:var(--muted); line-height:1.6; }
    .empty { display:grid; place-items:center; min-height:155px; margin-top:22px; border:1px dashed #344cff88; border-radius:14px; color:#858eae; text-align:center; padding:18px; }
    .empty strong { display:block; margin-bottom:7px; color:#dce4ff; }
  </style>
</head>
<body>
  <header class="top">
    <a class="back" href="./index.html" aria-label="Back to home">‹</a>
    <div class="brand"><strong>RYDEN INTERNATIONAL</strong><span>DIGITAL STORE</span></div>
  </header>
  <main>
    <section class="panel">
      <div class="eyebrow">EXCLUSIVE OFFERS</div>
      <h1>VIP Member</h1>
      <p class="intro">Your dedicated page for VIP offers.</p>
      <div class="empty">
        <div><strong>VIP offers will appear here</strong>Add your diamond offers and account deals here when you're ready.</div>
      </div>
    </section>
  </main>
</body>
</html>
