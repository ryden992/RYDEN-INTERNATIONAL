<text x="400" y="620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="bold" letter-spacing="12" fill="url(#silver)" stroke="#111B77" stroke-width="1">RYDEN</text>
<text x="400" y="669" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="bold" letter-spacing="8" fill="#FFFFFF">INTERNATIONAL</text>
