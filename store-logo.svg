<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
<title id="title">RYDEN INTERNATIONAL Blue Gradient Logo</title>
<desc id="desc">RYDEN International emblem in white and silver on a black background with a vivid electric-blue gradient glow inspired by the supplied reference.</desc>
<defs>
 <linearGradient id="electricBlue" x1="0" y1="1" x2="1" y2="0">
  <stop offset="0" stop-color="#252BFF"/><stop offset=".42" stop-color="#101BCE"/><stop offset=".72" stop-color="#080A39"/><stop offset="1" stop-color="#020307"/>
 </linearGradient>
 <linearGradient id="blueEdge" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#B9C7FF"/><stop offset=".38" stop-color="#4C6BFF"/><stop offset=".7" stop-color="#202FFF"/><stop offset="1" stop-color="#8AA5FF"/>
 </linearGradient>
 <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#C7D0E4"/><stop offset="1" stop-color="#FFFFFF"/>
 </linearGradient>
 <radialGradient id="glow" cx="50%" cy="100%" r="80%">
  <stop offset="0" stop-color="#252BFF" stop-opacity=".95"/><stop offset=".38" stop-color="#101BCE" stop-opacity=".65"/><stop offset="1" stop-color="#050509" stop-opacity="0"/>
 </radialGradient>
 <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="13" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
 </filter>
</defs>
<rect width="800" height="800" rx="56" fill="#030407"/>
<rect width="800" height="800" rx="56" fill="url(#glow)"/>
