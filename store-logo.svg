<circle cx="400" cy="355" r="320" fill="none" stroke="url(#blueEdge)" stroke-width="5"/>
<circle cx="400" cy="355" r="308" fill="none" stroke="#DCE5FF" stroke-opacity=".48" stroke-width="1.8"/>
<g fill="url(#silver)" stroke="url(#blueEdge)" stroke-width="4" stroke-linejoin="round">
