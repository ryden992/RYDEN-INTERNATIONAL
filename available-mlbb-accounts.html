<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050a13">
<title>AVAILABLE MLBB ACCOUNT | RYDEN INTERNATIONAL</title>
<meta name="description" content="Available MLBB accounts at RYDEN INTERNATIONAL.">
<link rel="stylesheet" href="./style.css">
<style>
.accounts-page{max-width:1100px;margin:0 auto;padding:18px 16px 100px;color:#f4f8ff}
.accounts-back{display:inline-flex;align-items:center;gap:8px;color:#b8d8ff;text-decoration:none;margin:8px 0 16px;font-weight:700}
.accounts-video-slot{position:relative;display:flex;align-items:center;justify-content:center;width:100%;min-width:0;box-sizing:border-box;min-height:0;aspect-ratio:16/9;max-height:360px;overflow:hidden;border:1px solid #258bff;border-radius:18px;background:radial-gradient(ellipse at 80% 20%,#0756a9 0,transparent 45%),linear-gradient(130deg,#06101f,#0a2440 58%,#03070e);box-shadow:inset 0 0 0 1px rgba(128,207,255,.08)}
.accounts-video-slot video{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;object-position:center;background:#050a13}\n.accounts-video-slot:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 20%,rgba(45,174,255,.08) 50%,transparent 80%);pointer-events:none}
.accounts-video-slot-copy{position:relative;text-align:center;padding:20px}
.accounts-video-slot-copy span{display:block;color:#72d2ff;font-size:10px;font-weight:900;letter-spacing:.18em;margin-bottom:10px}
.accounts-video-slot-copy strong{display:block;font-size:clamp(18px,4vw,28px);letter-spacing:.04em}
.accounts-video-slot-copy p{margin:8px 0 0;color:#c8d9ed;font-size:12px}
.accounts-section-title{font-size:18px;margin:24px 0 12px}
.accounts-empty-slot{min-height:100px;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;border:1px dashed #234d73;border-radius:14px;color:#9baec6;background:#071321;font-size:12px}
@media(min-width:700px){.accounts-page{padding-top:26px}.accounts-video-slot{min-height:0;max-height:360px}}
</style>
</head>
<body>
<header class="top-header">
<a class="brand" href="./index.html#home" aria-label="RYDEN INTERNATIONAL Home"><img src="./store-logo.jpg" alt="RYDEN logo"><span><b>RYDEN</b><small>INTERNATIONAL</small><em>DIGITAL STORE</em></span></a>
<a class="login-button" href="./index.html#home" style="text-decoration:none">Home</a>
</header>
<main class="accounts-page">
<a class="accounts-back" href="./index.html#home">← Back to All Games</a>
<section class="accounts-video-slot" aria-label="RYDEN INTERNATIONAL MLBB promotional video banner">
<video autoplay muted loop playsinline preload="metadata" poster="./banner-aspirants.jpg" aria-label="RYDEN INTERNATIONAL 3D banner video">
<source src="./videos/available-mlbb-banner.mp4" type="video/mp4">
Your browser does not support HTML video.
</video>
</section>
<h2 class="accounts-section-title">AVAILABLE MLBB ACCOUNT</h2>
<section class="accounts-empty-slot" aria-label="Available account listings placeholder">Account cards and your new images can be added here next.</section>
</main>
</body>
</html>
