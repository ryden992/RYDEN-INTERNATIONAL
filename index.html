<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RYDEN INTERNATIONAL | MLBB Marketplace</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#05070d;
  color:#fff;
}

a{
  text-decoration:none;
  color:inherit;
}

.hidden{
  display:none !important;
}

/* HEADER */
header{
  position:sticky;
  top:0;
  z-index:999;
  background:#080b13;
  border-bottom:1px solid #252b3a;
  box-shadow:0 5px 20px rgba(0,0,0,.5);
}

.navbar{
  max-width:1250px;
  margin:auto;
  min-height:70px;
  padding:10px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:22px;
  font-weight:900;
  letter-spacing:1px;
  color:#ffd34e;
  white-space:nowrap;
}

.nav-links{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  flex-wrap:wrap;
  gap:8px;
}

.nav-links a{
  padding:10px 13px;
  border-radius:8px;
  font-size:14px;
  font-weight:700;
  color:#ddd;
  transition:.2s;
}

.nav-links a:hover{
  background:#171d2a;
  color:#ffd34e;
}

/* HOME BANNER */
.hero{
  width:100%;
  position:relative;
  background:#000;
  overflow:hidden;
}

.hero-image{
  display:block;
  width:100%;
  height:auto;
  max-height:850px;
  object-fit:cover;
}

.hero-cta{
  position:absolute;
  left:7%;
  top:58%;
  width:38%;
  height:12%;
  cursor:pointer;
}

/* SECTIONS */
.container{
  width:min(1200px,94%);
  margin:auto;
  padding:55px 0;
}

.section-title{
  text-align:center;
  margin-bottom:30px;
}
