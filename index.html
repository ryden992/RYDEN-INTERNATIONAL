<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RYDEN INTERNATIONAL | MLBB Marketplace</title>

  <meta name="description"
        content="RYDEN INTERNATIONAL - Premium Mobile Legends account marketplace and diamond recharge.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Teko:wght@500;600;700&display=swap"
        rel="stylesheet">

  <style>
    /* =========================================================
       RYDEN INTERNATIONAL
       CUSTOMER HOMEPAGE
       ========================================================= */

    :root {
      --gold: #f5c84b;
      --gold-light: #ffe98a;
      --gold-dark: #a96d08;

      --blue: #168cff;
      --blue-light: #35c8ff;

      --bg: #02050b;
      --bg2: #07101e;
      --card: #091322;

      --text: #ffffff;
      --muted: #94a3b8;

      --border: rgba(245, 200, 75, 0.28);

      --shadow: 0 15px 45px rgba(0, 0, 0, 0.55);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background:
        radial-gradient(circle at top right, rgba(20, 110, 190, 0.10), transparent 35%),
        radial-gradient(circle at bottom left, rgba(245, 192, 68, 0.06), transparent 35%),
        var(--bg);

      color: var(--text);
      font-family: "Rajdhani", sans-serif;
      overflow-x: hidden;
    }

    a {
      color: inherit;
    }

    button,
    input {
      font-family: inherit;
    }

    /* =========================================================
       HEADER
       ========================================================= */

    header {
      position: sticky;
      top: 0;
      z-index: 9999;

      background: rgba(3, 8, 17, 0.94);
      backdrop-filter: blur(14px);

      border-bottom: 1px solid rgba(245, 200, 75, 0.22);

      box-shadow: 0 5px 30px rgba(0, 0, 0, 0.45);
    }

    .nav {
      width: min(1250px, 100%);
      margin: auto;

      min-height: 76px;
      padding: 10px 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;

      text-decoration: none;
      min-width: 0;
    }

    .brand img {
      width: 170px;
      height: 58px;

      object-fit: contain;
      object-position: left center;

      display: block;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .nav-links a {
      position: relative;

      color: #e5e7eb;
      text-decoration: none;

      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;

      padding: 26px 0;

      transition: 0.25s ease;
    }

    .nav-links a::after {
      content: "";

      position: absolute;
      left: 0;
      bottom: 14px;

      width: 0;
      height: 2px;

      background: var(--gold);

      box-shadow: 0 0 12px var(--gold);

      transition: 0.25s ease;
    }

    .nav-links a:hover {
      color: var(--gold);
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    /* Mobile menu button */

    .menu-btn {
      display: none;

      width: 45px;
      height: 42px;

      border: 1px solid var(--border);
      border-radius: 8px;

      background: #07101e;
      color: white;

      font-size: 22px;

      cursor: pointer;
    }

    /* =========================================================
       HERO
       ========================================================= */

    .hero {
      position: relative;

      width: 100%;
      min-height: 650px;

      overflow: hidden;

      border-bottom: 1px solid rgba(245, 200, 75, 0.22);

      background: #02050a;
    }

    .hero-image {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center center;

      filter: saturate(1.08) contrast(1.03);

      z-index: 0;
    }

    /* Dark overlay */

    .hero::after {
      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          90deg,
          rgba(1, 5, 12, 0.98) 0%,
          rgba(1, 5, 12, 0.90) 28%,
          rgba(1, 5, 12, 0.48) 52%,
          rgba(1, 5, 12, 0.10) 78%,
          rgba(1, 5, 12, 0.25) 100%
        );

      z-index: 1;
    }

    .hero-content {
      position: relative;
      z-index: 2;

      width: min(1250px, 100%);

      min-height: 650px;

      margin: auto;
      padding: 100px 25px 80px;

      display: flex;
      align-items: center;
    }

    .hero-text {
      width: 580px;
      max-width: 100%;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 9px;

      padding: 9px 16px;

      margin-bottom: 18px;

      border: 1px solid rgba(245, 200, 75, 0.55);
      border-radius: 5px;

      background: rgba(3, 10, 20, 0.65);

      color: #fff;

      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;

      box-shadow: 0 0 20px rgba(245, 200, 75, 0.08);
    }

    .hero-badge span {
      color: var(--gold);
    }

    .hero h1 {
      font-family: "Teko", sans-serif;

      font-size: clamp(65px, 8vw, 110px);

      line-height: 0.82;

      letter-spacing: 2px;

      text-transform: uppercase;

      margin-bottom: 22px;
    }

    .hero h1 .gold {
      display: block;

      background: linear-gradient(
        180deg,
        #fff8c9 0%,
        #ffe05a 38%,
        #e7a51a 72%,
        #8f5700 100%
      );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;

      filter: drop-shadow(0 5px 12px rgba(245, 192, 68, 0.28));
    }

    .hero h1 .white {
      display: block;

      color: white;

      text-shadow: 0 5px 18px rgba(0, 0, 0, 0.7);
    }

    .hero-description {
      border-left: 5px solid var(--gold);

      padding-left: 18px;

      max-width: 520px;

      color: #f1f5f9;

      font-size: 21px;
      font-weight: 600;

      line-height: 1.35;

      margin-bottom: 30px;
    }

    .hero-description strong {
      color: var(--gold);
    }

    /* Hero buttons */

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;

      gap: 13px;
    }

    .hero-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-width: 215px;

      padding: 15px 22px;

      border-radius: 6px;

      text-decoration: none;

      font-size: 16px;
      font-weight: 800;

      text-transform: uppercase;
      letter-spacing: 0.7px;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        filter 0.2s ease;
    }

    .hero-btn:hover {
      transform: translateY(-3px);
    }

    .accounts-btn {
      color: #050505;

      background: linear-gradient(
        180deg,
        #fff18a,
        #f5c044 45%,
        #b87808
      );

      border: 1px solid #ffe88b;

      box-shadow:
        0 5px 25px rgba(245, 192, 68, 0.35);
    }

    .accounts-btn:hover {
      box-shadow:
        0 8px 35px rgba(245, 192, 68, 0.55);
    }

    .diamonds-btn {
      color: white;

      background:
        linear-gradient(
          135deg,
          #1256a7,
          #00a9ed
        );

      border: 1px solid rgba(86, 210, 255, 0.7);

      box-shadow:
        0 5px 25px rgba(0, 153, 255, 0.30);
    }

    .diamonds-btn:hover {
      box-shadow:
        0 8px 35px rgba(0, 153, 255, 0.50);
    }

    /* =========================================================
       TRUST BAR
       ========================================================= */

    .trust-bar {
      position: absolute;

      z-index: 3;

      left: 0;
      right: 0;
      bottom: 0;

      background: rgba(2, 7, 15, 0.90);

      border-top: 1px solid rgba(245, 200, 75, 0.25);

      min-height: 76px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 55px;

      padding: 12px 20px;
    }

    .trust-item {
      display: flex;
      align-items: center;
      gap: 9px;

      color: #e2e8f0;

      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .trust-icon {
      color: var(--gold);
      font-size: 22px;
    }

    /* =========================================================
       WHATSAPP BANNER
       ========================================================= */

    .whatsapp-wrap {
      width: min(1180px, 100%);

      margin: 28px auto 0;

      padding: 0 20px;
    }

    .whatsapp-banner {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 12px;

      min-height: 58px;

      padding: 14px 20px;

      border-radius: 8px;

      text-decoration: none;

      color: white;

      background:
        linear-gradient(
          90deg,
          #0759b7,
          #0c9ce8,
          #0759b7
        );

      border: 1px solid rgba(255,255,255,0.25);

      font-size: 16px;
      font-weight: 800;

      text-transform: uppercase;
      letter-spacing: 0.6px;

      box-shadow:
        0 8px 30px rgba(0, 133, 255, 0.20);

      transition: 0.2s ease;
    }

    .whatsapp-banner:hover {
      transform: translateY(-2px);
      box-shadow:
        0 10px 35px rgba(0, 153, 255, 0.35);
    }

    /* =========================================================
       GENERAL SECTION
       ========================================================= */

    .section {
      width: min(1180px, 100%);

      margin: auto;

      padding: 70px 20px 20px;
    }

    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;

      gap: 20px;

      margin-bottom: 28px;

      border-bottom: 1px solid rgba(245, 200, 75, 0.20);

      padding-bottom: 13px;
    }

    .section-heading h2 {
      font-family: "Teko", sans-serif;

      color: var(--gold);

      font-size: 46px;

      line-height: 1;

      letter-spacing: 1.5px;

      text-transform: uppercase;
    }

    .section-heading p {
      color: var(--muted);

      font-size: 15px;
      font-weight: 600;
    }

    /* =========================================================
       SEARCH
       ========================================================= */

    .search-box {
      width: 100%;

      display: flex;

      margin-bottom: 25px;
    }

    .search-box input {
      width: 100%;

      padding: 15px 18px;

      border-radius: 7px;

      border: 1px solid #263b59;

      background: #050b15;

      color: white;

      outline: none;

      font-size: 16px;
      font-weight: 600;
    }

    .search-box input:focus {
      border-color: var(--gold);

      box-shadow:
        0 0 0 3px rgba(245, 200, 75, 0.08);
    }

    /* =========================================================
       ACCOUNT GRID
       ========================================================= */

    .account-grid {
      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 20px;
    }

    .account-card {
      overflow: hidden;

      background:
        linear-gradient(
          180deg,
          #0a1526,
          #050a13
        );

      border: 1px solid var(--border);

      border-radius:
