<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RYDEN INTERNATIONAL | MLBB Marketplace</title>

  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #050914;
      color: #fff;
      line-height: 1.5;
    }

    header {
      padding: 16px 20px;
      background: #07101f;
      border-bottom: 1px solid #163b70;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    nav {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      color: #39aaff;
      text-shadow: 0 0 15px rgba(22, 140, 255, 0.6);
      letter-spacing: 0.5px;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      margin: 0 8px;
      font-weight: 700;
      font-size: 13px;
      transition: color 0.2s;
    }

    nav a:hover { color: #39aaff; }

    .hero {
      position: relative;
      max-width: 1536px;
      margin: auto;
      overflow: hidden;
      background: #050914;
    }

    .hero-image {
      width: 100%;
      display: block;
    }

    .hero-cta {
      position: absolute;
      left: 8%;
      bottom: 27%;
      width: 31%;
      height: 11%;
      display: block;
      border-radius: 18px;
    }

    .hero-cta:hover {
      background: rgba(57, 170, 255, 0.12);
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 40px 20px;
    }

    .section-title {
      font-size: 26px;
      color: #39aaff;
      margin-bottom: 20px;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {

      border: 1px solid #173d70;
      border-radius: 14px;
