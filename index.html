<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RYDEN INTERNATIONAL | MLBB Marketplace</title>

<style>
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#050914;
  color:#fff;
}

/* ================= HEADER ================= */

header{
  padding:16px 20px;
  background:#07101f;
  border-bottom:1px solid #163b70;
  position:sticky;
  top:0;
  z-index:1000;
}

nav{
  max-width:1150px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.logo{
  font-size:24px;
  font-weight:900;
  color:#39aaff;
  text-shadow:0 0 15px #168cff;
  white-space:nowrap;
}

.nav-links{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:4px;
}

nav a{
  color:#fff;
  text-decoration:none;
  padding:9px 10px;
  border-radius:7px;
  font-weight:700;
  font-size:14px;
}

nav a:hover{
  color:#39aaff;
  background:rgba(57,170,255,.08);
}

/* ================= HERO ================= */

.hero{
  position:relative;
  width:100%;
  max-width:1536px;
  margin:auto;
  overflow:hidden;
  background:#050914;
}

.hero-image{
  width:100%;
  height:auto;
  display:block;
}

/* Transparent clickable area over banner */
.hero-cta{
  position:absolute;
  left:8%;
  bottom:27%;
  width:31%;
  height:11%;
  display:block;
  border-radius:18px;
}

.hero-cta:hover{
  background:rgba(57,170,255,.08);
}

/* ================= GENERAL ================= */

.container{
  max-width:1100px;
  margin:auto;
  padding:45px 20px;
}

.section-title{
  font-size:30px;
  color:#39aaff;
  margin:0 0 22px;
}
